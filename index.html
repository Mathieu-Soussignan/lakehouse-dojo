<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lakehouse Dojo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : un rail de navigation à gauche qui porte la ceinture, une colonne de travail à droite.
   Les couleurs viennent du sujet : l'eau du lac pour l'accent, bronze / argent / or pour le médaillon. */
:root{
  --bg:#edf2f3; --surface:#ffffff; --sunken:#e2eaec; --ink:#0f2a33; --muted:#557079; --line:#cfdcdf;
  --lake:#0b7285; --lake-ink:#ffffff; --lake-soft:#dbeff2;
  --bronze:#b3713d; --silver:#8191a0; --gold:#c9981a;
  --ok:#23804f; --ok-soft:#dff2e7; --bad:#bf4129; --bad-soft:#fae5df; --seal:#b4322a;
  --code-bg:#0f2a33; --code-ink:#dcebee;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a1a20; --surface:#11272e; --sunken:#0d2027; --ink:#e2eef0; --muted:#8fabb2; --line:#254650;
  --lake:#4fc4d6; --lake-ink:#062228; --lake-soft:#143943;
  --bronze:#d18c56; --silver:#a8b7c3; --gold:#e6ba40;
  --ok:#62cc92; --ok-soft:#143527; --bad:#f07e66; --bad-soft:#3b1d17; --seal:#e0574c;
  --code-bg:#071418; --code-ink:#dcebee; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0a1a20; --surface:#11272e; --sunken:#0d2027; --ink:#e2eef0; --muted:#8fabb2; --line:#254650;
  --lake:#4fc4d6; --lake-ink:#062228; --lake-soft:#143943;
  --bronze:#d18c56; --silver:#a8b7c3; --gold:#e6ba40;
  --ok:#62cc92; --ok-soft:#143527; --bad:#f07e66; --bad-soft:#3b1d17; --seal:#e0574c;
  --code-bg:#071418; --code-ink:#dcebee; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
a{color:var(--lake)} button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
code{font-family:var(--mono);font-size:.86em;background:var(--lake-soft);padding:1px 5px;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700} h3{font-size:1rem;font-weight:700}
p{margin:0} .muted{color:var(--muted)} .fine{color:var(--muted);font-size:.8rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;text-decoration:none;color:var(--ink)} .brand span{color:var(--lake)}
.me{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.me b{font-family:var(--display)} .me small{color:var(--muted)}
.belt{display:block;height:14px;border-radius:3px;background:var(--belt);border:1px solid var(--line);position:relative}
.belt::after{content:"";position:absolute;left:50%;top:-4px;width:18px;height:20px;margin-left:-9px;border-radius:4px;background:var(--belt);border:1px solid var(--line)}
.bar{height:6px;background:var(--sunken);border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:var(--lake);border-radius:99px;transition:width .5s}
.links{display:flex;flex-direction:column;gap:2px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500}
.links a:hover{background:var(--sunken)} .links a.on{background:var(--ink);color:var(--bg)}
.count{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--seal);color:#fff}
main{display:flex;flex-direction:column;gap:22px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hstack{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.head{display:flex;flex-direction:column;gap:6px}
.crumb{font-size:.85rem;color:var(--muted)} .crumb a{color:var(--muted)}

button,.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;display:inline-block}
button:hover:not(:disabled),.btn:hover{border-color:var(--lake)} button:disabled{opacity:.45;cursor:default}
.b-primary{background:var(--lake);border-color:var(--lake);color:var(--lake-ink);font-weight:600}
.b-warn{border-color:var(--bad);color:var(--bad)} .b-done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

/* accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:center}
.hero .belt{height:22px;max-width:340px} .hero .belt::after{height:30px;top:-5px;width:26px;margin-left:-13px}
.hero p.lead{font-size:1.05rem;color:var(--muted);max-width:52ch}
.xp{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums} .xp small{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:500}
.radar{width:100%;max-width:360px;justify-self:center} .radar text{font:600 10px var(--body);fill:var(--muted)}
.journey{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 8px}
.stop{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);text-align:center;font-size:.78rem;line-height:1.25}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lake) calc(var(--p)*1%),var(--sunken) 0)}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display)}
.stop:hover .ring b{background:var(--lake-soft)}
.seals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.seal{display:flex;gap:10px;align-items:center;font-size:.84rem;line-height:1.25}
.seal i{flex:none;width:38px;height:38px;border-radius:7px;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font:700 1.05rem var(--display);font-style:normal;transform:rotate(-6deg)}
.seal.off{color:var(--muted)} .seal.off i{border-color:var(--line);color:var(--line);border-style:dashed;transform:none}
.seal small{display:block;color:var(--muted)}
table.plain{width:100%;border-collapse:collapse} table.plain td,table.plain th{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.plain th{font-size:.78rem;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
label.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer} label.chk input{margin-top:5px;accent-color:var(--lake)}
.lb{display:flex;flex-direction:column;gap:6px} .lb-row{display:grid;grid-template-columns:24px 30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}
.lb-row.me-row{background:var(--lake-soft)} .lb-row img{width:30px;height:30px;border-radius:50%} .lb-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb-row .pts{font-variant-numeric:tabular-nums;font-weight:700} .lb-row .rk{color:var(--muted);font-variant-numeric:tabular-nums}
.lb-row .belt{width:44px;height:8px;display:inline-block;margin-right:8px;vertical-align:middle} .lb-row .belt::after{display:none}

/* parcours */
.mcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.mcard:hover{border-color:var(--lake)} .mcard .num{width:44px;height:44px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font:700 1.05rem var(--display)}
.mcard.full .num{background:var(--ok);color:var(--surface)} .mcard small{display:block;color:var(--muted)}
.mcard.dim,.stop.dim{opacity:.58} .mcard.dim:hover,.stop.dim:hover{opacity:1}
.pips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end} .pip{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pip.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.list{display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-self:flex-start} .seg button{border:0;border-radius:0;background:transparent} .seg button.on{background:var(--ink);color:var(--bg)}
.ask-item{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.ans-box{margin-left:24px;font-size:.92rem}
.playbook{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.playbook summary{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink)}
.pb-body{margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:.93rem}

/* module */
ul.pts,ol.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;max-width:75ch}
ul.traps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px} ul.traps li{padding:9px 12px;background:var(--bad-soft);border-radius:8px}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:9px;overflow-x:auto;font:13px/1.55 var(--mono)}
.codehead{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);gap:8px} .codehead button{padding:2px 10px;font-size:.78rem}
textarea{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sunken);resize:vertical}
details summary{cursor:pointer;color:var(--lake);font-weight:600}
.pill{font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}

/* cadre de simulateur */
.simframe{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.simframe>header{padding:14px 18px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);background:var(--sunken)}
.mission{align-self:flex-start;font-size:.82rem;font-weight:600;padding:4px 11px;border-radius:99px;border:1px dashed var(--seal);color:var(--seal)}
.mission.done{border:1px solid transparent;background:var(--ok-soft);color:var(--ok)}
.sim{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sim .sim-actions{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.sim .sim-note{background:var(--lake-soft);border-radius:9px;padding:10px 14px;font-size:.93rem;min-height:3.2em}
.sim .sim-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px} .sim .sim-cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.sim .sim-sub{border-top:1px solid var(--line);padding-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sim .zlabel{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:8px}
.sim select,.sim input[type=number]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:200px;max-width:100%}
.sim .result ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.sim input[type=range]{accent-color:var(--lake);width:100%;max-width:260px}
.sim .ctrl{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sim .big{font:700 2.1rem/1.1 var(--display);font-variant-numeric:tabular-nums} .sim .big small{font:500 .9rem var(--body);color:var(--muted)}
.sim .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)} .sim .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.sim .stack{display:flex;height:16px;border-radius:5px;overflow:hidden;margin:10px 0 8px;min-width:12px;transition:width .4s} .sim .s-dbu{background:var(--lake)} .sim .s-vm{background:var(--silver)}
.sim .meter{display:flex;gap:8px 24px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.sim .badge{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px} .sim .badge.ok{background:var(--ok-soft);color:var(--ok)} .sim .badge.ko{background:var(--bad-soft);color:var(--bad)}
.sim pre.mini{padding:9px 12px;font-size:12.5px;margin-bottom:8px}
.sim .result{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--sunken);font-size:.9rem} .sim .result.ok{background:var(--ok-soft)} .sim .result.ko{background:var(--bad-soft);color:var(--bad)}
.sim table.t{border-collapse:collapse;font-size:.88rem;width:100%} .sim table.t th,.sim table.t td{padding:4px 10px 4px 0;text-align:left;border-bottom:1px solid var(--line)} .sim table.t th{color:var(--muted);font-size:.75rem}
.sim .files{display:flex;gap:6px;flex-wrap:wrap}
.sim .chip{display:inline-flex;flex-direction:column;padding:5px 10px;border-radius:8px;font:600 .78rem var(--mono);border:1px solid transparent;line-height:1.3}
.sim .chip small{font:500 .68rem var(--body);opacity:.85}
.sim .chip.live{background:var(--lake);color:var(--lake-ink)} .sim .chip.stale{background:var(--sunken);color:var(--muted);border-color:var(--line)}
.sim .chip.gone{background:transparent;color:var(--bad);border:1px dashed var(--bad);text-decoration:line-through}
.sim .chip.narrow{background:var(--ok-soft);color:var(--ok)} .sim .chip.wide{background:var(--bad-soft);color:var(--bad)}
.sim .lg-live{background:var(--lake)} .sim .lg-stale{background:var(--sunken);border:1px solid var(--line)} .sim .lg-gone{border:1px dashed var(--bad)}
/* architecture */
.sim .zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sim .zone{border:1.5px dashed var(--line);border-radius:12px;padding:12px} .sim .z-dbx{border-color:var(--lake)} .sim .z-you{border-color:var(--bronze)}
.sim .nodes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sim .node{text-align:left;font-size:.86rem;background:var(--surface)} .sim .node.seen{border-color:var(--ok)} .sim .node.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sim .node.pulse{background:var(--gold);border-color:var(--gold);color:#1c1503;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}
/* droits */
.sim .lvl{border:1.5px solid var(--bad);border-radius:10px;padding:8px 10px;margin-top:6px;display:flex;flex-direction:column;gap:2px} .sim .lvl.open{border-color:var(--ok);background:var(--ok-soft)}
.sim .lvl>span::before{content:"fermé · ";color:var(--bad);font-size:.75rem;font-weight:700} .sim .lvl.open>span::before{content:"ouvert · ";color:var(--ok)}
/* notebook */
.sim .cell{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:6px} .sim .cell.ok{border-left-color:var(--ok)} .sim .cell.ko{border-left-color:var(--bad)}
.sim .cell-h{display:flex;gap:10px;align-items:center;font-size:.8rem} .sim .run{padding:1px 9px} .sim .lang{font-family:var(--mono);color:var(--lake);font-weight:600}
.sim .cell pre.mini{margin:0} .sim .cell-o{font-size:.88rem;padding:2px 4px} .sim .cell.ko .cell-o{color:var(--bad);font-family:var(--mono);font-size:.8rem}
.sim .bars{display:flex;gap:6px;align-items:flex-end;height:60px} .sim .bars i{width:26px;background:var(--lake);border-radius:3px 3px 0 0}
/* spark */
.sim .plan{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.sim .parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px} .sim .part{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:96px;background:var(--sunken)}
.sim .dots{display:flex;gap:6px;flex-wrap:wrap} .sim .dot{width:18px;height:18px;border-radius:50%;animation:pop .35s ease-out} .sim .d-a{background:var(--lake)} .sim .d-b{background:var(--gold)} .sim .d-c{background:var(--bad)}
@keyframes pop{from{transform:scale(.3);opacity:.2}}
/* delta */
.sim .delta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);gap:16px} .sim .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.sim .commit{text-align:left;font-size:.8rem;padding:6px 10px;display:flex;flex-direction:column} .sim .commit b{font-family:var(--mono)} .sim .commit small{font-family:var(--mono);color:var(--muted)}
.sim .commit.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)} .sim .commit.sel small{color:inherit;opacity:.8}
/* dag */
.sim .dag{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:4px} .sim .dag-col{display:flex;flex-direction:column;gap:8px} .sim .arrow{color:var(--muted);font-size:1.2rem}
.sim .task{min-width:118px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;background:var(--surface);font-size:.86rem} .sim .task small{color:var(--muted);font-size:.74rem}
.sim .t-run{border-color:var(--gold);animation:pulse .5s ease-in-out infinite alternate} .sim .t-ok{border-color:var(--ok);background:var(--ok-soft)}
.sim .t-fail,.sim .t-bad{border-color:var(--bad);background:var(--bad-soft)} .sim .t-skip{border-style:dashed;opacity:.65}
.sim .report{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* data skipping */
.sim .skip{display:flex;flex-direction:column;gap:4px} .sim .skip .row{display:grid;grid-template-columns:30px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:.76rem}
.sim .fname{font-family:var(--mono);color:var(--muted)} .sim .track{position:relative;height:14px;background:var(--sunken);border-radius:4px}
.sim .track i{position:absolute;top:2px;bottom:2px;border-radius:3px} .sim .track i.hit{background:var(--lake)} .sim .track i.miss{background:var(--silver);opacity:.45}
.sim .track .cur{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--seal);z-index:1}
.sim .fstate{color:var(--muted)} .sim .fstate.hit{color:var(--lake);font-weight:700}
.sim .axis .track{background:none;display:flex;justify-content:space-between;color:var(--muted);height:auto}

/* quiz et cartes */
.opt{display:block;width:100%;text-align:left;padding:12px 16px} .opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);opacity:1} .opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);opacity:1}
.expl{background:var(--lake-soft);border-radius:9px;padding:10px 14px}
.flip{perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%;display:block}
.flip-in{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d} .flip.back .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.15rem}
.face.b{transform:rotateY(180deg);background:var(--lake-soft);border-color:var(--lake)}
input.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}

/* Outils du rail, palette, fenêtres, examen, traducteur */
.rail-tools{display:flex;flex-direction:column;gap:6px;align-items:stretch} .rail-tools button{text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,15,18,.62);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.modal[hidden]{display:none}
